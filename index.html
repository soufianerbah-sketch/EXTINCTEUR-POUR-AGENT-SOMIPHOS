<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c3a">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sécurité IND SOMIPHOS</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#14231c;--mut:#5d6b64;--line:#d5dcd7;--pri:#0f5c3a;--onpri:#fff;--ok:#1f7a4a;--warn:#b86e00;--bad:#c0281c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#1a221e;--ink:#e9efeb;--mut:#9aa8a0;--line:#2c3832;--pri:#3fbf86;--onpri:#08140e;--ok:#4cc486;--warn:#f0a93a;--bad:#ff6b5e}}
:root[data-theme="dark"]{--bg:#101613;--card:#1a221e;--ink:#e9efeb;--mut:#9aa8a0;--line:#2c3832;--pri:#3fbf86;--onpri:#08140e;--ok:#4cc486;--warn:#f0a93a;--bad:#ff6b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;max-width:640px;margin-inline:auto;padding:16px}
h1{font-size:22px;margin:0}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd .sub{margin:2px 0 0}.logo{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
.sub{color:var(--mut);font-size:14px;margin:2px 0 14px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{border:0;border-radius:8px;padding:11px 16px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--ok);border-radius:8px;padding:12px;margin-bottom:10px}
.item.warn{border-inline-start-color:var(--warn)}.item.bad{border-inline-start-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sn{font-weight:700;font-size:17px}
.tag{font-size:13px;font-weight:700}
.ok .tag,.item .tag{color:var(--ok)}.warn .tag{color:var(--warn)}.bad .tag{color:var(--bad)}
.meta{color:var(--mut);font-size:14px;margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{padding:8px 12px;font-size:14px}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;display:none}
form.on{display:block}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{text-align:right}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
</style>
</head>

<div class="stats">
  <div class="stat"><b id="sAll">0</b>الكل</div>
  <div class="stat"><b id="sSoon">0</b>قريبة (30 يوماً)</div>
  <div class="stat"><b id="sLate">0</b>متأخرة</div>
</div>

<div class="bar">
  <input id="q" type="search" placeholder="🔍 ابحث بالرقم التسلسلي" autocomplete="off">
  <button id="addBtn">+ إضافة</button>
</div>

<form id="f">
  <label>نوع القارورة</label>
  <select id="type"><option>CO2</option><option>مسحوق أزوت (poudre azote)</option><option>مسحوق بخرطوشة (poudre cartouche)</option></select>
  <label>الرقم التسلسلي</label><input id="sn" required>
  <div class="two">
    <div><label>الوزن (كغ)</label><input id="w" type="number" step="0.1" inputmode="decimal"></div>
    <div><label>المكان</label><input id="loc"></div>
  </div>
  <div class="two">
    <div><label>تاريخ أول تشغيل</label><input id="first" class="dt" type="text" inputmode="numeric" maxlength="10" placeholder="يوم/شهر/سنة" dir="ltr" required></div>
    <div><label>تاريخ آخر عملية</label><input id="last" class="dt" type="text" inputmode="numeric" maxlength="10" placeholder="يوم/شهر/سنة" dir="ltr" required></div>
  </div>
  <label>العملية الأخيرة</label>
  <select id="op"><option value="controle">مراقبة (contrôle)</option><option value="recharge">إعادة شحن (recharge)</option></select>
  <div id="err" class="err"></div>
  <div class="acts"><button type="submit">حفظ</button><button type="button" class="alt" id="cancel">إلغاء</button></div>
</form>

<div id="list"></div>

<script>
const KEY="hse_extincteurs_v1";
let data=[],editId=null;
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
const addM=(s,n)=>{const d=new Date(s);d.setMonth(d.getMonth()+n);return d};
const iso=d=>d.toISOString().slice(0,10);
const fmt=i=>i?i.split("-").reverse().join("/"):"";
const fmtD=d=>fmt(iso(d));
const norm=v=>v.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\D/g,"").slice(0,8);
const parseD=v=>{const n=norm(v);if(n.length!==8)return null;const d=+n.slice(0,2),m=+n.slice(2,4),y=+n.slice(4);const t=new Date(Date.UTC(y,m-1,d));return(y>=2000&&t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d)?`${n.slice(4)}-${n.slice(2,4)}-${n.slice(0,2)}`:null};
document.querySelectorAll(".dt").forEach(el=>el.oninput=()=>{const n=norm(el.value);el.value=n.length>4?n.slice(0,2)+"/"+n.slice(2,4)+"/"+n.slice(4):n.length>2?n.slice(0,2)+"/"+n.slice(2):n});
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

// قاعدة: مراقبة أو شحن كل 6 أشهر، والشحن إجباري كل سنتين
function calc(x){
  const base=x.op==="recharge"?x.last:x.first;
  const due=addM(x.last,6);
  const nextOp=due>=addM(base,24)?"recharge":"controle";
  const days=Math.round((due-today())/864e5);
  return{due,nextOp,days};
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const rows=data.map(x=>({x,c:calc(x)})).sort((a,b)=>a.c.due-b.c.due)
    .filter(({x})=>!q||(x.sn+" "+x.loc).toLowerCase().includes(q));
  $("sAll").textContent=data.length;
  $("sLate").textContent=data.filter(x=>calc(x).days<0).length;
  $("sSoon").textContent=data.filter(x=>{const d=calc(x).days;return d>=0&&d<=30}).length;
  $("list").innerHTML=rows.length?"":(data.length?'<div class="empty">لا توجد قارورة بهذا الرقم التسلسلي.</div>':'<div class="empty">لا توجد قوارير بعد.<br>اضغط «+ إضافة» لتسجيل أول قارورة.</div>');
  rows.forEach(({x,c})=>{
    const cls=c.days<0?"bad":c.days<=30?"warn":"";
    const tag=c.days<0?`متأخرة ${-c.days} يوم`:c.days===0?"اليوم":`بعد ${c.days} يوم`;
    const el=document.createElement("div");el.className="item "+cls;
    el.innerHTML=`<div class="row"><span class="sn"></span><span class="tag">${tag}</span></div>
    <div class="meta" data-m></div><div class="meta" data-n></div>
    <div class="acts"><button class="alt" data-e>تحديث</button><button class="del" data-d>حذف</button></div>`;
    el.querySelector(".sn").textContent=x.sn;
    el.querySelector("[data-m]").textContent=`${x.type} • ${x.w?x.w+" كغ • ":""}${x.loc||"—"}`;
    el.querySelector("[data-n]").textContent=`الموعد القادم: ${fmtD(c.due)} — ${c.nextOp==="recharge"?"إعادة شحن (إجباري)":"مراقبة"}`;
    el.querySelector("[data-e]").onclick=()=>open(x);
    el.querySelector("[data-d]").onclick=()=>{const a=el.querySelector(".acts");a.innerHTML='<button class="del" data-y>تأكيد الحذف</button><button class="alt" data-n>إلغاء</button>';a.querySelector("[data-y]").onclick=()=>{data=data.filter(y=>y.id!==x.id);save();render()};a.querySelector("[data-n]").onclick=render};
    $("list").appendChild(el);
  });
}
function open(x){
  editId=x?x.id:null;
  $("type").value=x?x.type:"CO2";$("sn").value=x?x.sn:"";$("w").value=x?x.w:"";$("loc").value=x?x.loc:"";
  $("first").value=x?fmt(x.first):"";$("last").value=x?fmt(x.last):"";$("op").value=x?x.op:"controle";
  $("err").textContent="";$("f").classList.add("on");$("sn").focus();
}
$("addBtn").onclick=()=>open(null);
$("cancel").onclick=()=>$("f").classList.remove("on");
$("q").oninput=render;
$("f").onsubmit=e=>{
  e.preventDefault();
  const f1=parseD($("first").value),l1=parseD($("last").value);
  if(!f1||!l1){$("err").textContent="أدخل التاريخ بالأرقام: يوم/شهر/سنة، مثال 15/03/2025";return}
  const x={id:editId||Date.now(),type:$("type").value,sn:$("sn").value.trim(),w:$("w").value,loc:$("loc").value.trim(),first:f1,last:l1,op:$("op").value};
  data=editId?data.map(y=>y.id===editId?x:y):[...data,x];
  save();$("f").classList.remove("on");render();
};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
